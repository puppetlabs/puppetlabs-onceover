name: "ci"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  spec:
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
          - "3.2"
        include:
          - ruby_version: "3.2"
            puppet_gem_version: "~> 8.0"
        runs_on:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
          - "ubuntu-24.04-arm"
    # NOTE: no ruby 4.0 / puppet 9.0 lane yet -- the gemspec/Gemfile still
    # hard-depend on openvox regardless of puppet_gem_version until CAT-2776
    # flips the runtime dependency to puppet. Add that lane there, not here.
    name: "spec (${{ matrix.runs_on }} ruby ${{ matrix.ruby_version }} | puppet ${{ matrix.puppet_gem_version }})"
    uses: "puppetlabs/cat-github-actions/.github/workflows/gem_ci.yml@main"
    secrets: "inherit"
    with:
      rake_task: "full_tests"
      ruby_version: ${{ matrix.ruby_version }}
      puppet_gem_version: ${{ matrix.puppet_gem_version }}
      runs_on: ${{ matrix.runs_on }}
